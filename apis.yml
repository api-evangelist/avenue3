aid: avenue3
name: Avenue3
description: 'Avenue3 Limited is a UK open data and openEHR technology consultancy headquartered
  at Platform, New Station Street, Leeds. Founded in November 2020 (Companies House 13040131),
  the firm positions itself as a trusted public sector partner delivering strategy, discovery,
  architecture and full-stack engineering services that separate clinical data from the
  applications that write it. Its practice is built around openEHR — the vendor-neutral health
  record standard used by NHS organisations across England, Scotland and Wales and by national
  programmes in Norway, Germany, Slovenia and Australia — and it is a listed openEHR Industry
  Partner. Avenue3 sells consulting engagements rather than a software product: it publishes no
  developer portal, no API documentation and no machine-readable contract of its own, and the
  APIs it builds are operated by its clients. Its only public technical surface is the
  Avenue3-dev GitHub organisation, which ships a small set of general-purpose open-source
  developer libraries to npm and NuGet. Avenue3 is also listed on the UK Digital Marketplace as
  a G-Cloud 14 supplier.'
